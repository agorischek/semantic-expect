name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact v-prefixed semantic version requested by Garden
        required: true
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Validate requested version
        id: release
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "Releases must be prepared from the default branch" >&2
            exit 1
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "Garden version must be vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$VERSION" || \
             git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists" >&2
            exit 1
          fi
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Create release commit and tag
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          npm version "$RELEASE_VERSION" --no-git-tag-version --ignore-scripts
          test "$(git diff --name-only)" = "package-lock.json
          package.json"
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Release $VERSION"
          git tag -a "$VERSION" -m "Release $VERSION"
          # Release commits intentionally remain tag-only. Garden derives the next
          # version from tag history, and protected default branches stay unchanged.
          git push origin "refs/tags/$VERSION"

      - name: Dispatch publish workflow
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          for attempt in 1 2 3 4 5; do
            if gh workflow run publish.yml --ref "$VERSION" -f version="$VERSION"; then
              exit 0
            fi
            sleep "$((attempt * 5))"
          done
          exit 1
